spring.application.name=api-gateway
server.port=8080

# Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

spring.cloud.gateway.routes[0].id=payment-service
spring.cloud.gateway.routes[0].uri=lb://PAYMENT-SERVICE
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/payments/**
spring.cloud.gateway.routes[0].filters[0]=CircuitBreaker=paymentCB
spring.cloud.gateway.routes[0].filters[1]=FallbackHeaders

resilience4j.circuitbreaker.instances.productCB.slidingWindowSize=5
resilience4j.circuitbreaker.instances.productCB.failureRateThreshold=50
resilience4j.circuitbreaker.instances.productCB.waitDurationInOpenState=10s
resilience4j.circuitbreaker.instances.productCB.permittedNumberOfCallsInHalfOpenState=2


# -------- RATE LIMITER --------
resilience4j.ratelimiter.instances.orderLimiter.limitForPeriod=5
resilience4j.ratelimiter.instances.orderLimiter.limitRefreshPeriod=10s
resilience4j.ratelimiter.instances.orderLimiter.timeoutDuration=0


# Enable gateway to use service IDs
spring.cloud.gateway.discovery.locator.enabled=true
spring.cloud.gateway.discovery.locator.lower-case-service-id=true

logging.level.org.springframework.cloud.gateway=DEBUG
logging.level.reactor.netty.http.client=DEBUG


